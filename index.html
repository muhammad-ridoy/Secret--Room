<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Room 💖</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }
    header {
      padding: 20px;
      background: #1f2937;
      text-align: center;
      color: #f9a8d4;
      font-size: 24px;
      font-weight: bold;
    }
    #status {
      text-align: center;
      color: #9ca3af;
      padding: 10px;
    }
    #messages {
      height: 65vh;
      overflow-y: auto;
      padding: 15px;
    }
    .msg {
      background: #374151;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .sender {
      color: #f9a8d4;
      font-size: 13px;
      margin-bottom: 5px;
    }
    #form {
      display: flex;
      gap: 8px;
      padding: 12px;
    }
    input, button {
      padding: 13px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    #message {
      flex: 1;
      min-width: 0;
      background: #374151;
      color: white;
    }
    button {
      background: #ec4899;
      color: white;
    }
  </style>
</head>
<body>
  <header>🔒 Secret Room 💗</header>
  <div id="status">Connecting...</div>
  <div id="messages"></div>

  <form id="form">
    <input id="message" placeholder="Write a message..." required>
    <button type="submit">Send</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://eckusrvpdwacmefkhbog.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_p3E9YBkjUy66AC0iuQmuCQ_7rhfB67V";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const messagesBox = document.getElementById("messages");
    const statusBox = document.getElementById("status");

    async function loadMessages() {
      const { data, error } = await db
        .from("messages")
        .select("id, sender, message, created_at")
        .order("created_at", { ascending: true })
        .limit(100);

      if (error) {
        statusBox.textContent = "Connection error: " + error.message;
        return;
      }

      messagesBox.innerHTML = "";

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "msg";

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = item.sender || "Unknown";

        const text = document.createElement("div");
        text.textContent = item.message;

        div.append(sender, text);
        messagesBox.appendChild(div);
      });

      statusBox.textContent = "Connected";
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    document.getElementById("form").addEventListener(
      "submit", async function(event) {
        event.preventDefault();

        const input = document.getElementById("message");
        const message = input.value.trim();

        if (!message) return;

        statusBox.textContent = "Sending...";

        const { error } = await db.from("messages").insert({
          sender: "Ridoy",
          message: message
        });

        if (error) {
          statusBox.textContent = "Send failed: " + error.message;
          return;
        }

        input.value = "";
        await loadMessages();
      }
    );

    loadMessages();
    setInterval(loadMessages, 4000);
  </script>
</body>
</html>
